[controller_5]
extends = esp32_p4_base
controller_id = 25
ip_address = ${common.ip_domain}.${controller_5.controller_id}
build_flags =
  -D IP_DOMAIN_OCTET_0=${common.ip_domain_octet_0}
  -D IP_DOMAIN_OCTET_1=${common.ip_domain_octet_1}
  -D IP_DOMAIN_OCTET_2=${common.ip_domain_octet_2}
  -D CONTROLLER_ID=${controller_5.controller_id}
  '-D CONTROLLER_NAME="controller_5"'
  '-D CONTROLLER_NAMESPACE="controller_5"'
  -D ROS_DOMAIN_ID=8

[controller_5_ota]
extends = controller_5
upload_protocol = espota ; Override serial flash with OTA
upload_port = ${controller_5.ip_address} ; Set upload port to controller IP address
upload_flags = 
  --port=3232

[env:controller_5_micro_ros_test]
extends = micro_ros_test, controller_5_ota

[env:controller_5_micro_ros_service]
extends = micro_ros_service, controller_5_ota
